[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-process"
version = "1.0.0"
description = "Local product image processing with selective AI, human review, and batch ZIP export."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.34",
  "Pillow==13.0.0",
]

[project.optional-dependencies]
ai = ["rembg[cpu]==2.0.87"]
gpu = ["rembg[gpu]==2.0.87"]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
